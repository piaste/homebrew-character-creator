name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete unreferenced PNGs
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          for file in ./wwwroot/assets/icons/unsorted_icons/*.png; do
            [[ -f "$file" ]] || continue

            # Remove only the last extension
            stem=$(basename "$file" .png)

            if ! grep -RqiF -- "$stem" "$SEARCH_DIR"; then
              echo "Deleting: $file"
              rm -- "$file"
            else
              echo "Keeping:  $file"
            fi
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet workload restore && dotnet restore

      - name: Publish
        run: dotnet publish -c Release -o ../publish

      # Uncomment and replace "my-repo" if deploying a project site.
      #
      # - name: Set base href
      #   run: |
      #     sed -i 's|<base href="/" />|<base href="/my-repo/" />|' ../publish/wwwroot/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4